<!doctype html>
<!--
  ============================================================================
  PDF Converter — simple edition (single HTML file)
  ----------------------------------------------------------------------------
  One HTML document: the interface is rendered by the bundled app, all CSS sits in
  a single inlined <style> block and every line of logic is inlined as a classic
  <script>. There is no asset folder, no worker file and no build step — the file
  runs straight from the file system.
  
  WHO IT IS FOR
    Everyday users. Plain-language steps, "Your files stay private" promise, one
    big convert button, a friendly list of what is inside the finished PDF and a
    preview before saving. A link labelled "Advanced" reveals the technical view.

  FIDELITY NOTE
    No CSS reset / Preflight is shipped in this file. Application styles live in
    the native cascade layer "@layer app-ui", so document markup staged for
    rasterisation keeps real user-agent defaults — that is what preserves DOCX
    page breaks, Word paragraph spacing and PPTX geometry.

  RUNTIME DEPENDENCIES (fetched on demand, cached, multi-CDN fallbacks)
    jspdf · html2canvas · jszip · pdfjs-dist · docx-preview · xlsx (SheetJS)
    marked · @aiden0z/pptx-renderer       + Google Fonts (Cairo / Plus Jakarta)

  USAGE
    • Open the file directly (file://) or upload it to any static host.
    • Conversion happens 100% in this tab: no upload, no server, no telemetry.
  ============================================================================
-->

<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Converter — turn your documents and images into PDF</title>
    <meta
      name="description"
      content="Offline, in-memory converter for DOCX, PPTX, XLSX, CSV, Markdown, code, text and images to PDF with print-grade layout fidelity, Arabic/RTL support, sortable conversion queue and combined-PDF review dialog."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- conversion engines are loaded on demand at runtime from these mirrors -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://unpkg.com" />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
